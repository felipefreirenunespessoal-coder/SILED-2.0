# Exemplo para uma instancia com dados persistentes. Servico e disco podem ter custo.
services:
  - type: web
    name: siled-estrategico
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py --host 0.0.0.0
    healthCheckPath: /healthz
    disk:
      name: siled-dados
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: SILED_ENV
        value: production
      - key: SILED_DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: '1'
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: SILED_ADMIN_CPF
        sync: false
      - key: SILED_ADMIN_NAME
        sync: false
      - key: SILED_ADMIN_PASSWORD
        sync: false
