{% macro icon(name, cls='') -%}
<svg class="icon {{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'board' %}<rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="9" rx="1"/><path d="M14 16h7M14 20h7"/>
{% elif name == 'upload' %}<path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/>
{% elif name == 'report' %}<rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 8h6M9 12h6M9 16h4"/>
{% elif name == 'chart' %}<path d="M4 4v16h17M8 15v-4m5 4V6m5 9V9"/>
{% elif name == 'user' %}<circle cx="12" cy="8" r="3"/><path d="M5 21v-3a7 7 0 0 1 14 0v3"/>
{% elif name == 'menu' %}<path d="M4 6h16M4 12h16M4 18h16"/>
{% elif name == 'logout' %}<path d="M9 5H4v14h5m6-14 7 7-7 7M8 12h14"/>
{% elif name == 'close' %}<path d="m6 6 12 12M6 18 18 6"/>
{% elif name == 'file' %}<path d="M5 3h9l5 5v13H5zM14 3v6h5M9 13h6M9 17h4"/>
{% elif name == 'download' %}<path d="M12 3v13m-5-5 5 5 5-5M4 17v4h16v-4"/>
{% elif name == 'edit' %}<path d="m15 4 5 5M4 20l5-1L21 7l-5-5L4 14z"/>
{% elif name == 'shield' %}<path d="m12 2 8 3v6c0 5-4 9-8 11-4-2-8-6-8-11V5zM8 12l3 3 5-6"/>
{% else %}<circle cx="12" cy="12" r="9"/><path d="M12 8v5m0 4h.01"/>{% endif %}</svg>
{%- endmacro %}

{% macro csrf(token) -%}<input type="hidden" name="csrf_token" value="{{ token }}">{%- endmacro %}

{% macro flashes() -%}
{% for category, message in get_flashed_messages(with_categories=true) %}<div class="notice notice-{{ category }}" role="status">{{ message }}</div>{% endfor %}
{%- endmacro %}
